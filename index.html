<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<meta name="description" content="Ercan Atak — full-stack developer in Berlin. Portfolio at ercan-atak.de; also home of websites through the years, a personal museum of the early web.">
<meta property="og:title" content="Ercan Atak">
<meta property="og:description" content="Full-stack developer in Berlin — portfolio, and a personal museum of the early web.">

<style>
:root {
  --bg: #101418;
  --panel: #1a2129;
  --ink: #e8e6e1;
  --muted: #9aa4ae;
  --amber: #ffb454;
  --green: #7dd97d;
  --line: #2c3640;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg); color: var(--ink);
  font: 16px/1.6 Georgia, 'Times New Roman', serif;
  padding: 0 1rem;
  min-height: 100vh;
  display: flex; align-items: center; justify-content: center;
}
.wrap { max-width: 40rem; width: 100%; margin: 3rem auto; }
h1 { font-size: clamp(1.8rem, 5vw, 2.6rem); font-weight: normal; }
.sub { color: var(--muted); font: 13px Verdana, sans-serif; margin-top: .3rem; }
.doors { margin: 2.5rem 0; display: grid; gap: 1rem; }
.door {
  display: block; text-decoration: none; color: var(--ink);
  background: var(--panel);
  border: 1px solid var(--line); border-radius: 4px;
  padding: 1.25rem 1.5rem;
  transition: border-color .15s ease;
}
.door:hover { border-color: var(--amber); }
.door .go { font: bold 15px Verdana, sans-serif; color: var(--green); }
.door:hover .go { color: var(--amber); }
.door p { color: var(--muted); margin-top: .35rem; font-size: .95rem; }
footer { color: var(--muted); font-size: .85rem; border-top: 1px solid var(--line); padding-top: 1rem; }
footer a {
  color: var(--green); text-decoration: none;
  border-bottom: 1px dotted var(--green);
}
footer a:hover { color: var(--amber); border-color: var(--amber); }
footer .wink { font-style: italic; margin-top: .5rem; }
</style>
</head>
<body>

<div class="wrap">

<header>
  <h1>Ercan Atak</h1>
  <p class="sub">full-stack developer · Berlin</p>
</header>

<nav class="doors">
  <a class="door" href="https://ercan-atak.de">
    <span class="go">Portfolio →</span>
    <p>projects, skills, contact — ercan-atak.de</p>
  </a>
  <a class="door" href="/websites-through-the-years/">
    <span class="go">websites through the years →</span>
    <p>a personal museum of the early web, 1998 – 2013</p>
  </a>
</nav>

<footer>
  <p><a href="https://github.com/atakee72">github.com/atakee72</a></p>
  <p class="wink">This page replaced an eternally under-construction portfolio; it rests in the git history.</p>
</footer>

</div>

</body>
</html>
